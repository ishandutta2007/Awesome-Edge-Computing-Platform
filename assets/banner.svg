<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 50px; font-weight: 800; fill: url(#titleGrad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 500; fill: #94a3b8; letter-spacing: 1.5px; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #f8fafc; }
    
    @keyframes pulseParticle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.3); }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }

    .node { animation: floatNode 4s ease-in-out infinite; }
    .node-delay-1 { animation-delay: 1s; }
    .node-delay-2 { animation-delay: 2s; }
    .stream { stroke-dasharray: 8 8; animation: dashStream 2s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="16" fill="url(#glowGrad)" />

  <!-- Animated Dynamic Background Lines / Edge Mesh (Stays in background behind text) -->
  <g opacity="0.25">
    <line x1="100" y1="60" x2="300" y2="120" stroke="#38bdf8" stroke-width="2" class="stream" />
    <line x1="300" y1="120" x2="200" y2="260" stroke="#818cf8" stroke-width="2" class="stream" />
    <line x1="1000" y1="80" x2="900" y2="200" stroke="#c084fc" stroke-width="2" class="stream" />
    <line x1="900" y1="200" x2="1050" y2="270" stroke="#38bdf8" stroke-width="2" class="stream" />
    <line x1="300" y1="120" x2="900" y2="200" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Edge Nodes -->
    <circle cx="100" cy="60" r="6" fill="#38bdf8" class="node" />
    <circle cx="300" cy="120" r="8" fill="#818cf8" class="node node-delay-1" />
    <circle cx="200" cy="260" r="7" fill="#c084fc" class="node node-delay-2" />
    <circle cx="1000" cy="80" r="7" fill="#38bdf8" class="node node-delay-1" />
    <circle cx="900" cy="200" r="9" fill="#c084fc" class="node" />
    <circle cx="1050" cy="270" r="6" fill="#818cf8" class="node node-delay-2" />
  </g>

  <!-- Foreground Content (Guaranteed crisp visibility) -->
  <g text-anchor="middle" transform="translate(600, 0)">
    <!-- Decorative Category Pill -->
    <g transform="translate(0, 50)">
      <rect x="-140" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="0" y="21" class="badge-text" fill="#38bdf8">⚡ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title" filter="url(#glow)">Awesome Edge Computing Platform 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle">Global Distributed Infrastructure • Wasm Runtimes • Serverless Edge Functions</text>

    <!-- Dynamic Tech Feature Pills -->
    <g transform="translate(0, 240)">
      <!-- Pill 1: Edge Functions -->
      <g transform="translate(-240, 0)">
        <rect x="-80" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
        <text x="0" y="23" class="badge-text">⚡ Edge Functions</text>
      </g>
      <!-- Pill 2: WebAssembly -->
      <g transform="translate(0, 0)">
        <rect x="-80" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
        <text x="0" y="23" class="badge-text">⚙️ WebAssembly</text>
      </g>
      <!-- Pill 3: K8s Edge Orchestration -->
      <g transform="translate(240, 0)">
        <rect x="-100" y="0" width="200" height="36" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
        <text x="0" y="23" class="badge-text">☸️ K8s Edge Orchestration</text>
      </g>
    </g>
  </g>
</svg>
